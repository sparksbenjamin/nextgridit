<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">The Aegis request path</title><desc id="desc">Client requests pass through Aegis TLS and configured protection to your upstream application. Blocked requests stop at Aegis. PostgreSQL configuration and management are separate paths.</desc><style>svg{--bg:#edf4ef;--surface:#fff;--ink:#163a30;--muted:#46675b;--line:#91b7a6;--accent:#106e60;--soft:#d5eee3;--danger:#9c3939;--danger-soft:#f9e7e4} @media(prefers-color-scheme:dark){svg{--bg:#0e1b21;--surface:#182e30;--ink:#e5f2ed;--muted:#b3cec3;--line:#487365;--accent:#88dfc5;--soft:#1c4338;--danger:#f0a9a0;--danger-soft:#382828}}text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.box{fill:var(--surface);stroke:var(--line)}.core{fill:var(--soft);stroke:var(--accent);stroke-width:2}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.path{fill:none;stroke:var(--accent);stroke-width:2}.arrow{fill:var(--accent)}.state{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}.blocked{fill:var(--danger-soft);stroke:var(--danger)}.danger{fill:var(--danger)}.block-path{fill:none;stroke:var(--danger);stroke-width:2}</style><rect class="bg" width="1200" height="540" rx="14"/><text x="52" y="52" font-size="20" font-weight="600">The request path</text><text class="muted" x="1148" y="51" text-anchor="end" font-size="14">Architecture illustration</text>
<rect class="box" x="52" y="100" width="230" height="230" rx="12"/><text x="167" y="179" text-anchor="middle" font-size="28" font-weight="600">Your visitors</text><text class="muted" x="167" y="220" text-anchor="middle" font-size="18">HTTP(S) requests</text><text class="muted" x="167" y="256" text-anchor="middle" font-size="17">Websites · APIs</text>
<rect class="core" x="380" y="100" width="440" height="230" rx="12"/><text x="600" y="163" text-anchor="middle" font-size="38" font-weight="600">Aegis</text><text class="accent" x="600" y="205" text-anchor="middle" font-size="21">TLS + reverse proxy + WAF</text><text class="muted" x="600" y="251" text-anchor="middle" font-size="18">Your configured application policies</text><text class="muted" x="600" y="281" text-anchor="middle" font-size="17">Coraza · OWASP CRS · custom rules</text>
<rect class="box" x="920" y="100" width="228" height="230" rx="12"/><text x="1034" y="179" text-anchor="middle" font-size="26" font-weight="600">Your application</text><text class="muted" x="1034" y="220" text-anchor="middle" font-size="18">HTTP(S) upstream</text><text class="muted" x="1034" y="256" text-anchor="middle" font-size="17">On your infrastructure</text>
<path class="path" d="M282 215H369"/><path class="arrow" d="M380 215l-12-7v14z"/><path class="path" d="M820 215H909"/><path class="arrow" d="M920 215l-12-7v14z"/><text class="accent" x="870" y="193" text-anchor="middle" font-size="14">Accepted</text>
<path class="block-path" d="M600 330V399"/><path class="danger" d="M600 410l-7-12h14z"/>
<path class="state" d="M480 330V365H202V410M720 330V370H998V410"/>
<rect class="box" x="52" y="410" width="300" height="85" rx="10"/><text x="202" y="445" text-anchor="middle" font-size="21" font-weight="600">PostgreSQL</text><text class="muted" x="202" y="474" text-anchor="middle" font-size="16">Configuration + persistent state</text>
<rect class="blocked" x="430" y="410" width="340" height="85" rx="10"/><text class="danger" x="600" y="445" text-anchor="middle" font-size="21" font-weight="600">Blocked at the gateway</text><text class="muted" x="600" y="474" text-anchor="middle" font-size="16">Response follows configured policy</text>
<rect class="box" x="848" y="410" width="300" height="85" rx="10"/><text x="998" y="445" text-anchor="middle" font-size="21" font-weight="600">Management</text><text class="muted" x="998" y="474" text-anchor="middle" font-size="16">Separate dashboard + API access</text>
<text class="muted" x="600" y="525" text-anchor="middle" font-size="14">Solid paths: application traffic. Dashed paths: configuration and management.</text></svg>