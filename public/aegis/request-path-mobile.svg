<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1040" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc"><title id="title">The Aegis request path</title><desc id="desc">Client requests pass through Aegis to the application; blocked requests stop at the gateway. Configuration and management are separate.</desc><style>svg{--bg:#edf4ef;--surface:#fff;--ink:#163a30;--muted:#46675b;--line:#91b7a6;--accent:#106e60;--soft:#d5eee3;--danger:#9c3939;--danger-soft:#f9e7e4} @media(prefers-color-scheme:dark){svg{--bg:#0e1b21;--surface:#182e30;--ink:#e5f2ed;--muted:#b3cec3;--line:#487365;--accent:#88dfc5;--soft:#1c4338;--danger:#f0a9a0;--danger-soft:#382828}}text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.box{fill:var(--surface);stroke:var(--line)}.core{fill:var(--soft);stroke:var(--accent);stroke-width:2}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.path{fill:none;stroke:var(--accent);stroke-width:2}.arrow{fill:var(--accent)}.state{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}.blocked{fill:var(--danger-soft);stroke:var(--danger)}.danger{fill:var(--danger)}.block-path{fill:none;stroke:var(--danger);stroke-width:2}</style><rect class="bg" width="600" height="1040" rx="14"/>
<rect class="box" x="60" y="45" width="480" height="130" rx="12"/><text x="300" y="99" text-anchor="middle" font-size="30" font-weight="600">Your visitors</text><text class="muted" x="300" y="139" text-anchor="middle" font-size="23">HTTP(S) requests · websites + APIs</text>
<path class="path" d="M300 175V229"/><path class="arrow" d="M300 240l-7-12h14z"/>
<rect class="core" x="60" y="240" width="480" height="260" rx="12"/><text x="300" y="302" text-anchor="middle" font-size="44" font-weight="600">Aegis</text><text class="accent" x="300" y="349" text-anchor="middle" font-size="26">TLS + reverse proxy + WAF</text><text class="muted" x="300" y="403" text-anchor="middle" font-size="23">Your configured application policies</text><text class="muted" x="300" y="444" text-anchor="middle" font-size="22">Coraza · OWASP CRS · custom rules</text>
<path class="path" d="M300 500V559"/><path class="arrow" d="M300 570l-7-12h14z"/><text class="accent" x="330" y="539" font-size="20">Accepted</text>
<rect class="box" x="60" y="570" width="480" height="130" rx="12"/><text x="300" y="624" text-anchor="middle" font-size="30" font-weight="600">Your application</text><text class="muted" x="300" y="665" text-anchor="middle" font-size="23">HTTP(S) upstream · your infrastructure</text>
<path class="block-path" d="M540 370H575V790H551"/><path class="danger" d="M540 790l12-7v14z"/>
<rect class="blocked" x="60" y="740" width="480" height="100" rx="12"/><text class="danger" x="300" y="780" text-anchor="middle" font-size="26" font-weight="600">Blocked at the gateway</text><text class="muted" x="300" y="816" text-anchor="middle" font-size="21">Response follows configured policy</text>
<text class="muted" x="300" y="892" text-anchor="middle" font-size="21">Separate from public application traffic:</text>
<rect class="box" x="60" y="918" width="225" height="85" rx="10"/><text x="172" y="954" text-anchor="middle" font-size="23" font-weight="600">PostgreSQL</text><text class="muted" x="172" y="983" text-anchor="middle" font-size="19">Config + state</text>
<rect class="box" x="315" y="918" width="225" height="85" rx="10"/><text x="427" y="954" text-anchor="middle" font-size="23" font-weight="600">Management</text><text class="muted" x="427" y="983" text-anchor="middle" font-size="19">Dashboard + API</text></svg>